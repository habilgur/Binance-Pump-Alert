name: Binance Futures Spike Alert

on:
  schedule:
    # Her 5 dakikada bir çalıştır (UTC)
    - cron: '*/5 * * * *'
  workflow_dispatch: # GitHub arayüzünden elle tetiklemek için

permissions:
  contents: write

jobs:
  run-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scripti Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          THRESHOLD_PERCENT: ${{ secrets.THRESHOLD_PERCENT || '' }}
          PROXY_URL: ${{ secrets.PROXY_URL || '' }}
        run: |
          python main.py 2>&1 | tee last_run.log

      - name: Bot Durumunu Kaydet (State Push)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add state.json last_run.log
          git diff --staged --quiet || (git commit -m "chore: update alert history and settings [skip ci]" && git pull --rebase origin main && git push)
