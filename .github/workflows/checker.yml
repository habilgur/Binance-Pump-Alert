name: Binance Futures Spike Alert

on:
  schedule:
    # Her 10 dakikada bir çalıştır (UTC)
    - cron: '*/10 * * * *'
  workflow_dispatch: # GitHub arayüzünden elle tetiklemek için

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scripti Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          THRESHOLD_PERCENT: ${{ secrets.THRESHOLD_PERCENT || '50.0' }}
        run: python main.py
